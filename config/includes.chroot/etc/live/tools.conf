# /etc/live/tools.conf — настройки live-tools (пакет live-tools).
#
# Единственный параметр: показывать ли при выключении live-системы запрос
# «Please remove the live-medium, close the tray (if any) and press ENTER to
# continue:» (его печатает /usr/bin/live-medium-eject из live-tools).
#
# В PuraD этот запрос не нужен и вреден: он ждёт Enter, которого в
# графической сессии никто не нажмёт, и выключение висит ровно 90 секунд —
# DefaultTimeoutStopSec, после чего systemd убивает юнит и продолжает
# («Unable to finalize remaining file systems, loop devices, ignoring»).
# См. docs/PLAN.md, этап 7 и README, «Известные шероховатости установки».
#
# Лоток CD по-прежнему открывается (eject выполняется в фоне), пропадает
# только ожидание нажатия клавиши.
LIVE_MEDIUM_EJECT_VERBOSE=false
