#
# Timeshift >= 22.06 монтирует снимки в /run/timeshift/<pid>/backup/
# timeshift-btrfs. --timeshift-auto учит grub-btrfsd находить этот каталог
# самому, без перечисления SNAPSHOTS_DIRS в ExecStart.
[Service]
ExecStart=
ExecStart=/usr/bin/grub-btrfsd --syslog --timeshift-auto