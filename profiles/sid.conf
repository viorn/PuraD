# Профиль: Debian "sid" (unstable)
# Только различия релиза. Общие настройки — в config/common.
#
# Sid в произвольный момент может быть несобираемым (mid-transition),
# поэтому зеркало — снимок snapshot.debian.org, а не живой архив.
# Конкретную дату снимка фиксируем здесь, чтобы сборка была воспроизводимой.

LB_DISTRIBUTION="sid"

# Снимок архива. Дату менять осознанно и коммитить вместе с VERSION.
SNAPSHOT_DATE="20251101T000000Z"
LB_MIRROR_BOOTSTRAP="http://snapshot.debian.org/archive/debian/${SNAPSHOT_DATE}"
LB_MIRROR_DEBIAN="http://snapshot.debian.org/archive/debian/${SNAPSHOT_DATE}"
# В snapshot-архиве security-путей нет; sid не имеет security-архива.
LB_MIRROR_SECURITY=""
LB_PARENT_MIRROR_SECURITY=""

# У sid нет ни -security, ни -updates.
LB_UPDATES="false"

# Пиннинг на origin снимка — Этап 8: config/archives/*.pref.chroot
# (live-build не поддерживает config/apt/preferences.chroot; apt-preferences
#  подхватываются только из config/archives/).
