# Монтирование целевой системы (Calamares, модуль mount).
#
# Своя версия вместо унаследованной из calamares-settings-debian: добавлены
# раскладка btrfs-сабтомов и опции монтирования (в Debian их нет, поэтому все
# записи /etc/fstab получались с голым "defaults").
#
# Этап 7 (docs/PLAN.md): btrfs раскладывается на @ → /, @home → /home,
# @log → /var/log, @cache → /var/cache; сжатие zstd прописывается в fstab
# через mountOptions (модуль fstab берёт опции из mountOptionsList, который
# заполняет именно этот модуль — см. src/modules/mount/main.py в Calamares).
---
# Что монтировать в целевую систему сверх её собственных разделов. Без этого
# набора не работает ни chroot, ни apt (нужен /dev/pts), ни efibootmgr.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]
      # /dev/pts нужен apt для записи логов

# Раскладка btrfs. Сабтомы создаются модулем mount (btrfs subvolume create) и
# монтируются с subvol=; модуль fstab потом выводит их отдельными строками.
# Сабтом с точкой монтирования / обязан идти первым.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache

# Swap-файл на btrfs живёт в отдельном сабтоме: в снапшот-сабтоме swap
# запрещён (данные повреждённой ФС), модуль mount создаёт @swap сам, если
# пользователь выбрал swap-файл.
btrfsSwapSubvol: /@swap

# Опции монтирования. Попадают и в монтирование при установке, и в /etc/fstab.
# Порядок важен: сначала точное совпадение по ФС, "default" — фолбэк.
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      # ESP не должна быть доступна на запись обычному пользователю.
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      # compress=zstd — сжатие по умолчанию (уровень 3): прозрачно для
      # пользователя, экономит место на типичных текстах и бинарниках.
      options: [ defaults, noatime, "compress=zstd" ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
