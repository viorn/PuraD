# Загрузчик установленной системы (Calamares, модуль bootloader).
#
# Своя версия вместо унаследованной из calamares-settings-debian: набор ключей
# тот же, но без секции systemd-boot — PuraD ставит только GRUB.
#
# Пакеты загрузчика ставит не этот модуль, а helper calamares-bootloader-config
# (calamares-settings-debian): grub-pc при BIOS, grub-efi + shim при UEFI,
# из локального apt-репозитория на носителе
# (config/hooks/normal/0500-purad-installer-repo.binary). Этот модуль делает
# grub-install, efibootmgr и grub-mkconfig в целевой системе.
---
# На UEFI — GRUB (не systemd-boot, не sb-shim: shim нужен для Secure Boot,
# которого у нас нет).
efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Копия загрузчика в EFI/BOOT/BOOTX64.EFI: страховка для железа, которое
# плохо читает NVRAM, и для случая, когда запись efibootmgr не удалась.
installEFIFallback: true
