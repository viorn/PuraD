# packagechooser-session.conf — вопрос «какой сеанс Plasma по умолчанию».
#
# Модуль packagechooser подключён как экземпляр `packagechooser@session`
# (settings.conf → instances). В режиме `legacy` он не ставит пакеты, а
# кладёт в global storage строку с id выбранного пункта:
#
#   packagechooser_session = "wayland" | "x11"
#
# Значение читает наш job purad-session (шаг сразу после displaymanager)
# и пишет /var/lib/sddm/state.conf в целевой системе.
#
# Экземпляр нужен именно потому, что ключ global storage складывается как
# "packagechooser_" + id экземпляра: ключ `id:` внутри файла Calamares 3.3
# не читает (Config::setConfigurationMap смотрит только mode/method/
# items/default/packageChoice/labels).
#
# Тексты только на английском: интерфейс Calamares в образе английский
# (Debian не поставляет переводы в пакете calamares), и переводы отдельных
# строк здесь давали смесь языков на одной странице.
---
mode: required
method: legacy
default: wayland

labels:
    step: "Session"

items:
    - id: wayland
      name: "Wayland (default)"
      description: >-
          Modern Plasma 6 session protocol: smooth rendering and correct
          scaling on HiDPI displays. X11 applications run through XWayland.

    - id: x11
      name: "X11 (best compatibility)"
      description: >-
          Classic X server: old video drivers, screen capture tools and
          applications that do not support Wayland yet.
