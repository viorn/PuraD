# Конфигурация Calamares для PuraD.
#
# Основа — /etc/calamares/settings.conf из пакета calamares-settings-debian
# (он рассчитан именно на live-систему: распаковка /run/live/medium/live/
# filesystem.squashfs, чистка sources.list, bootloader-config для Debian).
# Отличия: брендинг purad и отключённые ссылки на несуществующий сайт.
#
# Правки модулей лежат рядом: /etc/calamares/modules/*.conf — часть из них
# своя (welcome, partition, mount, fstab, bootloader — этап 7), часть
# наследуется от calamares-settings-debian. Свой python-модуль
# purad-efi-fallback (/usr/lib/<triplet>/calamares/modules) доделывает
# резервный путь загрузки EFI/boot, который Calamares оставляет без grub.cfg.
---

modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
# Фаза 1 — вопросы пользователю.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

# Фаза 2 — установка.
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - purad-efi-fallback
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount

# Фаза 3 — итог.
- show:
  - finished

branding: purad

prompt-install: false
dont-chroot: false
