# Страница приветствия Calamares.
#
# Ссылок на сайт проекта пока нет, поэтому все три «ссылочных» блока выключены
# (в branding.desc соответствующие URL не заданы — иначе Calamares показал бы
# кнопки, ведущие в никуда).
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false

requirements:
    # Минимумы для установки; на live-системе с Plasma реальные значения выше.
    requiredStorage:    15
    requiredRam:        1.5
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
