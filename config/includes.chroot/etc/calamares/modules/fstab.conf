# /etc/fstab и /etc/crypttab установленной системы (Calamares, модуль fstab).
#
# Своя версия вместо унаследованной из calamares-settings-debian: там остались
# ключи mountOptions/ssdExtraMountOptions от Calamares 3.2. В 3.3 опции
# монтирования приходят не отсюда, а из mountOptionsList (модуль mount →
# mount.conf), поэтому ключи Debian молча игнорировались, а схема конфигурации
# ругалась на неизвестные поля.
#
# Здесь только то, что действительно читает модуль fstab 3.3
# (см. fstab.schema.yaml): crypttabOptions и tmpOptions.
---
# Опции /etc/crypttab для LUKS. keyscript=/bin/cat нужен, чтобы
# luksbootkeyfile мог положить /crypto_keyfile.bin во вторую строку ключей.
crypttabOptions: luks,discard,keyscript=/bin/cat

# /tmp: отдельной строки в fstab нет, каталог живёт на корневой ФС (как в
# обычном Debian). tmpfs в /tmp на btrfs с compress=zstd экономит мало, зато
# съедает RAM при сборках и распаковках.
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: false
        options: ""
