# config/bootloaders/grub-pc/config.cfg — переопределение шаблона live-build.
#
# Причина: шаблон задаёт только `set default=0`, без `set timeout=`, а GRUB
# без timeout ждёт ввода бесконечно — UEFI-загрузка вставала на меню.
# 30 = 3 секунды, как у isolinux (config/bootloaders/isolinux/isolinux.cfg).
set default=0
set timeout=30

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
