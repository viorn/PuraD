# packages.conf — что установщик удаляет из установленной системы.
#
# Перекрывает файл из calamares-settings-debian (тот лежит тут же и приходит
# из пакета; наш include побеждает при сборке образа).
#
# Отличие от дистрибутивного списка: убраны live-task-localisation и
# live-task-recommended. В нашем образе (KDE, свой список пакетов) их нет, а
# apt-get remove несуществующего пакета завершается с кодом 100:
#
#   E: Unable to locate package live-task-localisation
#
# Потому что на этом шаге единственный источник apt в целевой системе — сам
# носитель (модуль sources-final идёт позже), а на носителе этих пакетов нет.
# Проверка: scripts/test-boot.sh --installer сверяет список ниже с составом
# образа, чтобы такая же ошибка не всплыла снова.
#
# Правило: здесь только пакеты, которые реально есть в образе.
backend: apt

operations:
  - remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - calamares-settings-debian
