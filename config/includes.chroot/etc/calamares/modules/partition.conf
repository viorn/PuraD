# Разметка диска (Calamares, модуль partition).
#
# Своя версия вместо унаследованной из calamares-settings-debian: у Debian
# этого файла нет вообще, поэтому настройки были умолчаниями Calamares.
# Здесь зафиксированы решения проекта (docs/PLAN.md, этап 7):
#   * файловые системы — только ext4 и btrfs;
#   * таблица разделов: GPT при UEFI, MSDOS при BIOS. Это не настройка, а
#     поведение модуля 3.3: тип таблицы для «Стереть диск» берётся из
#     globalStorage.defaultPartitionTableType, который никто не заполняет, и
#     PartitionActions::doAutopartition() падает в
#     `partType = isEfi ? gpt : msdos`. Ключ requiredPartitionTableType
#     (Config::acceptPartitionTableType) только фильтрует уже существующие
#     таблицы и на автораскладку не влияет — поэтому его здесь нет.
#     Навязывать GPT на BIOS не нужно и опасно: там core.img GRUB приходится
#     класть в зазор между GPT и первым разделом, а bios_grub Calamares не
#     создаёт;
#   * EFI-раздел создаётся только при установке в UEFI (isEfi ? GPT + ESP :
#     1 МиБ пустого места и дальше корень).
---
# Что предлагать в «Стереть диск». Default обязан быть в списке, иначе
# Calamares пишет предупреждение и оставляет свой список.
availableFileSystemTypes:
    - ext4
    - btrfs

# ext4 по умолчанию: предсказуемая и самая совместимая.
defaultFileSystemType: ext4

# EFI-раздел (UEFI). 512 МиБ: с запасом под будущее обновление загрузчика и
# несколько ядер.
efi:
    mountPoint: /boot/efi
    recommendedSize: 512MiB
    minimumSize: 64MiB
    label: EFI

# Swap: по умолчанию не создавать. Варианты оставляем пользователю; для btrfs
# swap-файл кладётся в отдельный сабтом @swap (mount.conf) — тот, что не
# попадает в снапшоты, иначе btrfs-swap может повредить ФС.
initialSwapChoice: none
userSwapChoices:
    - none
    - small
    - suspend
    - file

# Ручная разметка доступна (нужна тем, кто ставит рядом с другой системой).
allowManualPartitioning: true
alwaysShowPartitionLabels: true

# Ничего не выбираем заранее: «Стереть диск» пользователь должен выбрать сам,
# иначе одно нажатие Next уничтожает данные.
initialPartitioningChoice: none

# Шифрование всего диска: LUKS2, автоматическое — выключено (только вручную).
luksGeneration: luks2
enableLuksAutomatedPartitioning: false
