# config/bootloaders/isolinux/isolinux.cfg — переопределение шаблона live-build.
#
# Причина: live-build 1:20250505+deb13u1 кладёт `timeout 0`, а в syslinux это
# «ждать ввода бесконечно» — BIOS-загрузка вставала на меню до нажатия клавиши.
# 30 = 3 секунды: успевает показаться меню (в т.ч. fail-safe), но live-CD
# загружается сам.
include menu.cfg
default vesamenu.c32
prompt 0
timeout 30
