# Конфигурация Calamares для PuraD.
#
# Основа — /etc/calamares/settings.conf из пакета calamares-settings-debian
# (он рассчитан именно на live-систему: распаковка /run/live/medium/live/
# filesystem.squashfs, чистка sources.list, bootloader-config для Debian).
# Отличия: брендинг purad и отключённые ссылки на несуществующий сайт.
#
# Правки модулей лежат рядом: /etc/calamares/modules/*.conf — часть из них
# своя (welcome, partition, mount, fstab, bootloader — этап 7), часть
# наследуется от calamares-settings-debian. Свои python-модули
# (/usr/lib/<triplet>/calamares/modules): purad-efi-fallback доделывает
# резервный путь загрузки EFI/boot, который Calamares оставляет без grub.cfg;
# purad-session записывает выбранный сеанс Plasma в /var/lib/sddm/state.conf.

modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

# Экземпляры модулей. Нужны, когда у модуля должен быть свой конфиг и свой
# ключ global storage: packagechooser в режиме legacy пишет значение как
# "packagechooser_<id экземпляра>", а ключ `id:` в самом конфиге Calamares 3.3
# не читает. Отсюда packagechooser@session и ключ packagechooser_session,
# который читает purad-session.
instances:
- id: session
  module: packagechooser
  config: packagechooser-session.conf

sequence:
# Фаза 1 — вопросы пользователю.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@session
  - summary

# Фаза 2 — установка.
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - purad-session
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - purad-efi-fallback
  - packages
  - purad-snapshots
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount

# Фаза 3 — итог.
- show:
  - finished

branding: purad

prompt-install: false
dont-chroot: false
